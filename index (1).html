<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryelee</title>
<meta name="description" content="Ryelee — links">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0c0e;
    --card: #141417;
    --text: #f5f5f5;
    --muted: #9a9aa2;
    --accent: #e8c9a0;
    --tt: #000000;
    --x: #000000;
    --of: #00aff0;
    --radius: 18px;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(232,201,160,0.08), transparent 60%),
      var(--bg);
  }
  .page{
    width:100%;
    max-width:460px;
    padding: 0 0 56px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .hero{
    width:100%;
    position:relative;
    overflow:hidden;
  }
  .hero img{
    width:100%;
    height: 420px;
    object-fit: cover;
    object-position: 60% 30%;
    display:block;
  }
  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(12,12,14,0) 45%, rgba(12,12,14,0.92) 92%, var(--bg) 100%);
  }
  .identity{
    margin-top: -64px;
    position: relative;
    z-index: 2;
    text-align:center;
    padding: 0 28px;
  }
  .name{
    font-family: "Playfair Display", serif;
    font-style: italic;
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 0.3px;
    margin: 0 0 8px;
    text-shadow: 0 2px 24px rgba(232,201,160,0.25);
  }
  .tagline{
    color: var(--muted);
    font-size: 18px;
    margin: 0 0 24px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }
  .socials{
    display:flex;
    justify-content:center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .social-btn{
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color: var(--text);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .social-btn:active{ transform: scale(0.94); }
  .social-btn svg{ width: 22px; height: 22px; }

  .links{
    width:100%;
    padding: 0 28px;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }
  .link-btn{
    display:flex;
    align-items:center;
    gap: 14px;
    width:100%;
    padding: 16px 20px;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
    text-decoration:none;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.2px;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .link-btn:active{ transform: scale(0.98); }
  .link-btn .icon{
    width: 26px;
    height: 26px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .link-btn .icon svg{ width:100%; height:100%; }
  .link-btn .label{ flex:1; text-align:left; }
  .link-btn .chev{
    color: var(--muted);
    font-size: 18px;
  }

  .link-btn.primary{
    background: linear-gradient(135deg, #15aeff, #0088d1);
    border: none;
    font-size: 20px;
    font-weight: 700;
    padding: 20px 20px;
    box-shadow: 0 8px 24px rgba(21,174,255,0.25);
  }
  .link-btn.primary .label small{
    display:block;
    font-weight: 400;
    font-size: 12.5px;
    opacity: 0.85;
    margin-top: 2px;
  }

  footer{
    margin-top: 36px;
    color: #55555d;
    font-size: 12px;
    letter-spacing: 0.3px;
  }
</style>
</head>
